<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sam console — test harness</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="./sam.css">
<style>
  body { margin: 0; background: #FFFFF5; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 40px auto; padding: 0 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 24px; }
  .card { border: 1px solid #E7E4D6; border-radius: 22px; overflow: hidden; background: #fff; }
  .note { grid-column: 1 / -1; text-align: center; font-size: 13px; color: #82868A; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card"><div data-sam-agent="agent_7701kj8r7k2feqg8ge4jqmmkbhan" data-locale="en" data-theme="light" data-debug></div></div>
  <div class="card"><div data-sam-agent="agent_7701kj8r7k2feqg8ge4jqmmkbhan" data-locale="en" data-theme="dark" data-debug></div></div>
  <p class="note">Test harness, both themes. If this origin isn't on the agent's allowlist the console shows "couldn't connect" — test on talkpush.com instead.</p>
</div>
<script type="module" src="./sam.js"></script>
</body>
</html>
